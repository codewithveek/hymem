# One command, same result on Linux, macOS, and Windows (Docker Desktop / WSL2 backend):
#   HYDRADB_REPO=~/hydradb docker compose up --build
# PowerShell:
#   $env:HYDRADB_REPO="C:\src\hydradb"; docker compose up --build
#
# The container is Linux either way, so the Rust/GraphBLAS build behaves
# identically on every host OS — this is the recommended Windows path.

services:
  hydradb:
    build:
      context: ${HYDRADB_REPO:?Set HYDRADB_REPO to your clone of github.com/hydra-db/hydradb}
      # If the repo's Dockerfile lives elsewhere or is named differently,
      # adjust `dockerfile:` here to match.
    ports:
      - "7687:7687"   # Bolt
      - "8443:8443"   # HTTP query API
      - "9090:9090"   # Admin
    # The entrypoint writes the auth-token into the /data volume, which is
    # root-owned; without this the container exits with "cannot create
    # /data/auth-token: Permission denied".
    user: root
    environment:
      # `local` persists to /data/store but currently fails every WRITE with
      #   object store error: Operation `put_opts` with mode `PutMode::Update`
      #   not yet implemented by LocalFileSystem(file:///data/store)
      # because SlateDB's LocalFileSystem backend has no conditional put.
      # Reads work; writes do not. Use `memory` (non-persistent) for tests and
      # demos, or point at S3/MinIO for a durable store that supports CAS.
      CLOUD_PROVIDER: ${HYDRADB_STORE:-memory}
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=0.0.0.0:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
    volumes:
      - hydradb-data:/data
    entrypoint: >
      sh -c "mkdir -p /data/store /data/cache &&
             printf 'local-development-token-32-bytes' > /data/auth-token &&
             exec graph-node"

volumes:
  hydradb-data:
